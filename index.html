<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Payment Form</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #f4f6f9;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .payment-container {
            background-color: #ffffff;
            width: 100%;
            max-width: 450px;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
        }

        h2 {
            margin-bottom: 20px;
            color: #333333;
            font-size: 24px;
            text-align: center;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #555555;
            font-size: 14px;
            font-weight: 600;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #cccccc;
            border-radius: 6px;
            font-size: 16px;
            color: #333333;
            outline: none;
            transition: border-color 0.2s ease;
        }

        input:focus {
            border-color: #0070f3;
        }

        .form-row {
            display: flex;
            gap: 15px;
        }

        .form-row .form-group {
            flex: 1;
            margin-bottom: 0;
        }

        .submit-btn {
            width: 100%;
            background-color: #0070f3;
            color: white;
            border: none;
            padding: 14px;
            font-size: 16px;
            font-weight: 600;
            border-radius: 6px;
            cursor: pointer;
            transition: background-color 0.2s ease;
            margin-top: 10px;
        }

        .submit-btn:hover {
            background-color: #0051b3;
        }

        .security-note {
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            color: #777777;
            margin-top: 15px;
            gap: 5px;
        }
    </style>
</head>
<body>

<div class="payment-container">
    <h2>Secure Payment</h2>
    
    <!-- Replace action URL with your backend payment processing endpoint -->
    <form action="/process-payment" method="POST">
        
        <!-- Cardholder Name -->
        <div class="form-group">
            <label Pisign for="card-name">Cardholder Name</label>
            <input type="text" id="card-name" name="card_name" placeholder="John Doe" required autocomplete="cc-name">
        </div>

        <!-- Card Number -->
        <div class="form-group">
            <label for="card-number">Card Number</label>
            <input type="text" id="card-number" name="card_number" placeholder="1234 5678 1234 5678" inputmode="numeric" pattern="[0-9\s]{13,19}" maxlength="19" required autocomplete="cc-number">
        </div>

        <!-- Expiry and CVC Row -->
        <div class="form-row form-group">
            <div class="form-group">
                <label for="card-expiry">Expiration Date</label>
                <input type="text" id="card-expiry" name="card_expiry" placeholder="MM/YY" pattern="(0[1-9]|1[0-2])\/([0-9]{2})" maxlength="5" required autocomplete="cc-exp">
            </div>
            
            <div class="form-group">
                <label for="card-cvc">CVC / CVV</label>
                <input type="text" id="card-cvc" name="card_cvc" placeholder="123" inputmode="numeric" pattern="[0-9]{3,4}" maxlength="4" required autocomplete="cc-csc">
            </div>
        </div>

        <!-- Submit Button -->
        <button type="submit" class="submit-btn">Pay Now</button>
        
        <div class="security-note">
            🔒 Encrypted, secure connection
        </div>
    </form>
</div>

</body>
</html>
